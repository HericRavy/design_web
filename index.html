<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 08: Interação JS e HTML</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h3>data:18/09/2026</h3>
    <h1>Meus Amigos</h1>
    <hr/>
    <form action="#" id="cadastro" method="post">
        <table>
            <tr>
                <td>Nome</td>
                <td>
                    <input type="dname" required name="nome"/>
                </td>
            </tr>

             <tr>
                <td>Data de Nascimento</td>
                <td>
                    <input type="date" required name="nasc"/>
                </td>
            </tr>

             <tr>
                <td>WhatsApp</td>
                <td>
                    <input type="tel" required name="whatsapp"/>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Adicionar">
                    <input type="reset" value="Redefinir">
                </td>
            </tr>
        </table>
    </form>
    <hr>
    <ul id="lista">
        <li>Lista Vazia</li>
    </ul>
    <script src="./Js/app.js" defer></script>
</body>
</html>
